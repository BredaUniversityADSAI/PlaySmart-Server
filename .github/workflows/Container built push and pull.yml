name: Build, push and deploy

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build and deploy'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - frontend
          - backend
          - pipeline
          - inference
  push:
    branches:
      - main   

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.set-matrix.outputs.services }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'electron-app/**'
            backend:
              - 'backend/**'
            pipeline:
              - 'pipeline/**'
            inference:
              - 'inference/**'
            compose:
              - 'docker-compose.yml'

      - name: Build service matrix
        id: set-matrix
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.service }}" = "all" ]; then
              echo 'services=["backend","pipeline","inference","frontend"]' >> $GITHUB_OUTPUT
            else
              echo 'services=["${{ github.event.inputs.service }}"]' >> $GITHUB_OUTPUT
            fi
          elif [ "${{ steps.filter.outputs.compose }}" = "true" ]; then
            echo "docker-compose.yml changed — rebuilding all services"
            echo 'services=["backend","pipeline","inference","frontend"]' >> $GITHUB_OUTPUT
          else
            services=()
            [ "${{ steps.filter.outputs.frontend }}" = "true" ]  && services+=("\"frontend\"")
            [ "${{ steps.filter.outputs.backend }}" = "true" ]   && services+=("\"backend\"")
            [ "${{ steps.filter.outputs.pipeline }}" = "true" ]  && services+=("\"pipeline\"")
            [ "${{ steps.filter.outputs.inference }}" = "true" ] && services+=("\"inference\"")
            joined=$(IFS=,; echo "${services[*]}")
            echo "services=[${joined}]" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: Map service to folder
        id: ctx
        run: |
          case "${{ matrix.service }}" in
            frontend) echo "path=electron-app" >> $GITHUB_OUTPUT ;;
            *) echo "path=${{ matrix.service }}" >> $GITHUB_OUTPUT ;;
          esac

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.ctx.outputs.path }}
          push: true
          tags: playsmartbuas/bg-app-${{ matrix.service }}:latest

  deploy:
    needs: [detect-changes, build-and-push]
    runs-on: self-hosted
    steps:
      - name: Pull and restart changed services
        run: |
          cd /home/kowalski/app
          services='${{ needs.detect-changes.outputs.services }}'
          svc_list=$(echo "$services" | jq -r '.[]' | tr '\n' ' ')
          echo "Deploying: $svc_list"
          docker compose pull $svc_list
          docker compose up -d $svc_list
          docker compose ps